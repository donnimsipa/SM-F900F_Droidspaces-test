name: Build Kernel

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (Optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python2 p7zip-full android-sdk-libsparse-utils erofs-utils default-jdk gnupg libncurses5
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          # Set random tag if not provided
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            TAG="v$(date +'%Y%m%d%H%M')"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          
          # Run build script
          bash build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droidspaces-KSUN-Samsung-SM-F900F
          path: build/Droidspaces-KSUN-Samsung-SM-F900F.tar

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: "Kernel Release ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "build/Droidspaces-KSUN-Samsung-SM-F900F.tar"
          body: "Automated build of Droidspaces-KSUN Kernel.\nCommit: ${{ github.sha }}"
